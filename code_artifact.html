<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>알록달록 유아용 테트리스</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Gaegu & Jua for cute Korean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      font-family: 'Jua', 'Gaegu', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1);
      border: 4px solid #ffffff;
    }
    .btn-bounce {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.92);
    }
    /* Cute bounce keyframes for line clears and badges */
    @keyframes cheerPop {
      0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-pop {
      animation: cheerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-2 md:p-4 text-slate-800 min-h-screen">

  <!-- Top Header Section -->
  <header class="w-full max-w-lg flex justify-between items-center bg-white/80 backdrop-blur rounded-3xl p-3 px-5 border-4 border-yellow-300 shadow-lg mb-2">
    <div class="flex items-center gap-2">
      <span class="text-3xl animate-bounce">🧩</span>
      <h1 class="text-2xl md:text-3xl font-extrabold text-pink-500 tracking-wide drop-shadow-sm">
        알록달록 테트리스
      </h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" class="btn-bounce bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-bold p-2 px-3 rounded-2xl shadow border-2 border-yellow-500 text-sm flex items-center gap-1">
        <i class="fa-solid fa-volume-high text-base"></i>
        <span id="soundText">소리 켜짐</span>
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-center gap-4 my-auto">
    
    <!-- Left / Top Info Panel: Next Piece, Score, Cheer Mascot -->
    <div class="game-card rounded-3xl p-4 w-full md:w-56 flex flex-row md:flex-col items-center justify-between gap-3">
      <!-- Mascot Cheerleader -->
      <div class="flex flex-col items-center">
        <div id="mascot" class="text-5xl md:text-6xl transition-transform duration-300 hover:scale-125 cursor-pointer">
          🐻
        </div>
        <div id="cheerBubble" class="mt-1 bg-pink-100 text-pink-700 font-bold text-xs md:text-sm px-3 py-1 rounded-full border border-pink-300 text-center shadow-sm">
          파이팅! 할 수 있어!
        </div>
      </div>

      <!-- Next Piece Container -->
      <div class="flex flex-col items-center bg-yellow-50/80 rounded-2xl p-2 border-2 border-yellow-200 w-28 md:w-full">
        <span class="text-sm text-yellow-700 font-bold mb-1">다음 블록</span>
        <canvas id="nextCanvas" width="100" height="80" class="rounded-xl"></canvas>
      </div>

      <!-- Score & Stars -->
      <div class="flex flex-col items-center bg-sky-50/80 rounded-2xl p-2 border-2 border-sky-200 w-28 md:w-full">
        <span class="text-sm text-sky-700 font-bold">내 점수</span>
        <div id="scoreText" class="text-2xl md:text-3xl font-extrabold text-sky-600">0</div>
        <div class="flex text-yellow-400 text-xs mt-0.5 gap-0.5" id="starContainer">
          ★ ★ ★
        </div>
      </div>
    </div>

    <!-- Center Play Field Canvas -->
    <div class="relative game-card rounded-3xl p-3 border-4 border-pink-300 flex flex-col items-center shadow-2xl">
      <!-- Canvas Overlay Notification for Cheers -->
      <div id="cheerBanner" class="hidden absolute top-12 z-20 bg-yellow-300 text-yellow-900 border-4 border-white font-extrabold text-2xl md:text-3xl px-6 py-2 rounded-full shadow-2xl animate-pop pointer-events-none">
        최고예요! 🎉
      </div>

      <canvas id="tetrisCanvas" width="240" height="400" class="bg-indigo-950/10 rounded-2xl border-2 border-slate-200 shadow-inner"></canvas>

      <!-- Speed Control Options (Kid Friendly) -->
      <div class="mt-3 flex items-center justify-center gap-2 text-xs md:text-sm">
        <span class="font-bold text-slate-600">속도:</span>
        <button id="speedEasy" class="speed-btn bg-emerald-400 text-white px-3 py-1 rounded-full font-bold shadow border-2 border-emerald-500">
          🐌 아주 천천히
        </button>
        <button id="speedNormal" class="speed-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold shadow">
          🐰 보통
        </button>
      </div>
    </div>

    <!-- Right / Mobile Controls Section -->
    <div class="w-full max-w-sm flex flex-col items-center gap-2">
      <!-- Touch Buttons Grid for Toddlers / Mobile -->
      <div class="grid grid-cols-3 gap-2 w-full max-w-xs">
        <div></div>
        <button id="btnRotate" class="btn-bounce bg-pink-400 hover:bg-pink-500 text-white font-extrabold py-3 rounded-2xl shadow-lg border-b-4 border-pink-600 flex flex-col items-center justify-center">
          <i class="fa-solid fa-rotate-right text-xl"></i>
          <span class="text-xs mt-1">돌리기</span>
        </button>
        <div></div>

        <button id="btnLeft" class="btn-bounce bg-sky-400 hover:bg-sky-500 text-white font-extrabold py-3 rounded-2xl shadow-lg border-b-4 border-sky-600 flex flex-col items-center justify-center">
          <i class="fa-solid fa-arrow-left text-xl"></i>
          <span class="text-xs mt-1">왼쪽</span>
        </button>
        
        <button id="btnDrop" class="btn-bounce bg-purple-400 hover:bg-purple-500 text-white font-extrabold py-3 rounded-2xl shadow-lg border-b-4 border-purple-600 flex flex-col items-center justify-center">
          <i class="fa-solid fa-angles-down text-xl"></i>
          <span class="text-xs mt-1">쏙 넣기</span>
        </button>

        <button id="btnRight" class="btn-bounce bg-sky-400 hover:bg-sky-500 text-white font-extrabold py-3 rounded-2xl shadow-lg border-b-4 border-sky-600 flex flex-col items-center justify-center">
          <i class="fa-solid fa-arrow-right text-xl"></i>
          <span class="text-xs mt-1">오른쪽</span>
        </button>
      </div>

      <button id="btnSoftDrop" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold w-full max-w-xs py-2 rounded-2xl shadow-md border-b-4 border-amber-600 flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-down"></i>
        <span>천천히 내려오기</span>
      </button>
    </div>

  </main>

  <!-- Bottom Footer -->
  <footer class="text-xs text-slate-500 mt-2 font-bold text-center">
    💡 키보드 방향키(← → ↓)와 위쪽 키(↑: 회전), 스페이스바(바로 내리기)로도 조작할 수 있어요!
  </footer>

  <!-- Start / Game Over Modal Overlay -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="game-card rounded-3xl p-6 md:p-8 max-w-sm w-full text-center flex flex-col items-center animate-pop border-4 border-yellow-300">
      <div id="modalEmoji" class="text-6xl mb-2 animate-bounce">🎈</div>
      <h2 id="modalTitle" class="text-3xl font-extrabold text-pink-500 mb-2">
        알록달록 테트리스!
      </h2>
      <p id="modalDesc" class="text-slate-600 font-bold mb-6">
        예쁜 블록들을 쌓아 줄을 맞춰보세요!<br>아주 천천히 내릴 수 있어요!
      </p>
      
      <button id="startBtn" class="btn-bounce bg-emerald-400 hover:bg-emerald-500 text-white text-2xl font-extrabold px-8 py-4 rounded-3xl shadow-xl border-b-4 border-emerald-600 w-full flex items-center justify-center gap-3">
        <i class="fa-solid fa-play"></i>
        <span>게임 시작!</span>
      </button>
    </div>
  </div>

  <script>
    // --- Web Audio Synth for Kid-Friendly Sounds ---
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!isSoundOn) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    // Play pleasant cute melodies for events
    function playMoveSound() {
      playTone(440, 'sine', 0.08, 0.08); // Cute soft pop
    }

    function playRotateSound() {
      playTone(587.33, 'triangle', 0.1, 0.12); // Higher soft tone
    }

    function playDropSound() {
      playTone(261.63, 'sine', 0.12, 0.15); // Thump tone
    }

    function playClearSound() {
      if (!isSoundOn) return;
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 fanfare
        notes.forEach((freq, i) => {
          setTimeout(() => {
            playTone(freq, 'triangle', 0.2, 0.15);
          }, i * 80);
        });
      } catch (e) {}
    }

    function playGameOverSound() {
      if (!isSoundOn) return;
      try {
        initAudio();
        const notes = [400, 350, 300, 250];
        notes.forEach((freq, i) => {
          setTimeout(() => {
            playTone(freq, 'sine', 0.2, 0.1);
          }, i * 120);
        });
      } catch (e) {}
    }

    // --- Game Configuration & Constants ---
    const COLS = 8;    // Slightly fewer columns for easier toddler play
    const ROWS = 12;   // Fewer rows so screen isn't overwhelmed
    const BLOCK_SIZE = 30; // 240x360 canvas size (8 cols * 30px, 12 rows * 30px)

    const canvas = document.getElementById('tetrisCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');

    // Canvas sizing setup
    canvas.width = COLS * BLOCK_SIZE;
    canvas.height = ROWS * BLOCK_SIZE;

    // Friendly bright soft palette for blocks
    const SHAPES = [
      {
        // I Shape (Cyan)
        shape: [[1, 1, 1, 1]],
        color: '#38bdf8',
        borderColor: '#0284c7',
        eyeStyle: 'happy'
      },
      {
        // J Shape (Blue)
        shape: [[1, 0, 0], [1, 1, 1]],
        color: '#818cf8',
        borderColor: '#4f46e5',
        eyeStyle: 'wink'
      },
      {
        // L Shape (Orange)
        shape: [[0, 0, 1], [1, 1, 1]],
        color: '#fb923c',
        borderColor: '#ea580c',
        eyeStyle: 'surprised'
      },
      {
        // O Shape (Yellow - Big Square)
        shape: [[1, 1], [1, 1]],
        color: '#facc15',
        borderColor: '#ca8a04',
        eyeStyle: 'cute'
      },
      {
        // S Shape (Green)
        shape: [[0, 1, 1], [1, 1, 0]],
        color: '#4ade80',
        borderColor: '#16a34a',
        eyeStyle: 'happy'
      },
      {
        // T Shape (Purple)
        shape: [[0, 1, 0], [1, 1, 1]],
        color: '#c084fc',
        borderColor: '#9333ea',
        eyeStyle: 'cute'
      },
      {
        // Z Shape (Pink)
        shape: [[1, 1, 0], [0, 1, 1]],
        color: '#f472b6',
        borderColor: '#db2777',
        eyeStyle: 'wink'
      }
    ];

    // Encouraging Korean messages for line clears
    const CHEER_MESSAGES = [
      "우와! 대단해요! 🌟",
      "참 잘했어요! 🎈",
      "최고의 실력이에요! 👑",
      "멋져요! 짝짝짝! 👏",
      "슈퍼 파워! 🚀",
      "블록 만점! ✨"
    ];

    const MASCOTS = ["🐻", "🐰", "🐱", "🐶", "🦁", "🦄"];

    // Game variables
    let board = [];
    let currentPiece = null;
    let nextPiece = null;
    let score = 0;
    let isGameOver = false;
    let isPaused = true;
    let dropInterval = 1000; // Easy speed default (1000ms)
    let lastDropTime = 0;
    let particles = [];

    // --- Particles for Line Clears & Celebrations ---
    function createConfetti(x, y) {
      const colors = ['#f472b6', '#38bdf8', '#facc15', '#4ade80', '#c084fc'];
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.7) * 8,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          life: 40 + Math.random() * 20
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2; // gravity
        p.alpha -= 1 / p.life;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // --- Input Listener Setup ---
    function setupControls() {
      document.addEventListener('keydown', (e) => {
        if (isPaused || isGameOver) return;
        if (e.key === 'ArrowLeft') {
          moveLeft();
          e.preventDefault();
        } else if (e.key === 'ArrowRight') {
          moveRight();
          e.preventDefault();
        } else if (e.key === 'ArrowDown') {
          moveDown();
          e.preventDefault();
        } else if (e.key === 'ArrowUp') {
          rotatePiece();
          e.preventDefault();
        } else if (e.key === ' ') {
          hardDrop();
          e.preventDefault();
        }
      });

      // UI Touch & Button Bindings
      document.getElementById('btnLeft').onclick = () => { if(!isPaused) moveLeft(); };
      document.getElementById('btnRight').onclick = () => { if(!isPaused) moveRight(); };
      document.getElementById('btnRotate').onclick = () => { if(!isPaused) rotatePiece(); };
      document.getElementById('btnSoftDrop').onclick = () => { if(!isPaused) moveDown(); };
      document.getElementById('btnDrop').onclick = () => { if(!isPaused) hardDrop(); };

      // Sound Toggle Button
      document.getElementById('soundToggleBtn').onclick = () => {
        isSoundOn = !isSoundOn;
        const icon = document.querySelector('#soundToggleBtn i');
        const text = document.getElementById('soundText');
        if (isSoundOn) {
          icon.className = "fa-solid fa-volume-high text-base";
          text.textContent = "소리 켜짐";
        } else {
          icon.className = "fa-solid fa-volume-xmark text-base";
          text.textContent = "소리 끔";
        }
      };

      // Speed selection buttons
      const speedEasyBtn = document.getElementById('speedEasy');
      const speedNormalBtn = document.getElementById('speedNormal');

      speedEasyBtn.onclick = () => {
        dropInterval = 1000;
        speedEasyBtn.className = "speed-btn bg-emerald-400 text-white px-3 py-1 rounded-full font-bold shadow border-2 border-emerald-500";
        speedNormalBtn.className = "speed-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold shadow";
      };

      speedNormalBtn.onclick = () => {
        dropInterval = 550;
        speedNormalBtn.className = "speed-btn bg-emerald-400 text-white px-3 py-1 rounded-full font-bold shadow border-2 border-emerald-500";
        speedEasyBtn.className = "speed-btn bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold shadow";
      };

      // Mascot Click interaction
      document.getElementById('mascot').onclick = () => {
        const mascots = MASCOTS;
        const randomMascot = mascots[Math.floor(Math.random() * mascots.length)];
        document.getElementById('mascot').textContent = randomMascot;
        playRotateSound();
      };

      // Start / Play Again Button
      document.getElementById('startBtn').onclick = resetGame;
    }

    // --- Core Tetris Piece Operations ---
    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function getRandomPiece() {
      const idx = Math.floor(Math.random() * SHAPES.length);
      const template = SHAPES[idx];
      return {
        shape: template.shape,
        color: template.color,
        borderColor: template.borderColor,
        eyeStyle: template.eyeStyle,
        x: Math.floor((COLS - template.shape[0].length) / 2),
        y: 0
      };
    }

    function collide(pX, pY, pieceShape) {
      for (let r = 0; r < pieceShape.length; r++) {
        for (let c = 0; c < pieceShape[r].length; c++) {
          if (pieceShape[r][c]) {
            const newX = pX + c;
            const newY = pY + r;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && board[newY][newX]) return true;
          }
        }
      }
      return false;
    }

    function moveLeft() {
      if (!collide(currentPiece.x - 1, currentPiece.y, currentPiece.shape)) {
        currentPiece.x--;
        playMoveSound();
      }
    }

    function moveRight() {
      if (!collide(currentPiece.x + 1, currentPiece.y, currentPiece.shape)) {
        currentPiece.x++;
        playMoveSound();
      }
    }

    function moveDown() {
      if (!collide(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
        currentPiece.y++;
        return true;
      } else {
        lockPiece();
        return false;
      }
    }

    function hardDrop() {
      while (!collide(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
        currentPiece.y++;
      }
      playDropSound();
      lockPiece();
    }

    function rotatePiece() {
      const rotated = currentPiece.shape[0].map((_, i) =>
        currentPiece.shape.map(row => row[i]).reverse()
      );
      if (!collide(currentPiece.x, currentPiece.y, rotated)) {
        currentPiece.shape = rotated;
        playRotateSound();
      } else if (!collide(currentPiece.x - 1, currentPiece.y, rotated)) {
        // Wall kick left
        currentPiece.x--;
        currentPiece.shape = rotated;
        playRotateSound();
      } else if (!collide(currentPiece.x + 1, currentPiece.y, rotated)) {
        // Wall kick right
        currentPiece.x++;
        currentPiece.shape = rotated;
        playRotateSound();
      }
    }

    // --- Piece Locking and Line Clears ---
    function lockPiece() {
      // Place piece cells into board
      for (let r = 0; r < currentPiece.shape.length; r++) {
        for (let c = 0; c < currentPiece.shape[r].length; c++) {
          if (currentPiece.shape[r][c]) {
            const boardY = currentPiece.y + r;
            if (boardY < 0) {
              triggerGameOver();
              return;
            }
            board[boardY][currentPiece.x + c] = {
              color: currentPiece.color,
              borderColor: currentPiece.borderColor,
              eyeStyle: currentPiece.eyeStyle
            };
          }
        }
      }

      checkLineClears();

      // Spawn next piece
      currentPiece = nextPiece;
      nextPiece = getRandomPiece();
      drawNextPiece();

      if (collide(currentPiece.x, currentPiece.y, currentPiece.shape)) {
        triggerGameOver();
      }
    }

    function checkLineClears() {
      let linesCleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== null)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(null));
          linesCleared++;
          r++; // Re-check row after shift
        }
      }

      if (linesCleared > 0) {
        score += linesCleared * 100;
        document.getElementById('scoreText').textContent = score;

        playClearSound();
        showCheerMessage();
        createConfetti((COLS * BLOCK_SIZE) / 2, (ROWS * BLOCK_SIZE) / 2);
      }
    }

    function showCheerMessage() {
      const banner = document.getElementById('cheerBanner');
      const cheerBubble = document.getElementById('cheerBubble');
      const randomMsg = CHEER_MESSAGES[Math.floor(Math.random() * CHEER_MESSAGES.length)];

      banner.textContent = randomMsg;
      banner.classList.remove('hidden');
      cheerBubble.textContent = randomMsg;

      // Animate mascot
      const mascot = document.getElementById('mascot');
      mascot.style.transform = 'scale(1.4) rotate(15deg)';
      setTimeout(() => {
        mascot.style.transform = 'scale(1) rotate(0deg)';
      }, 400);

      setTimeout(() => {
        banner.classList.add('hidden');
      }, 1200);
    }

    // --- Canvas Rendering Functions ---
    function drawBlock(context, x, y, size, color, borderColor, eyeStyle = null, isGhost = false) {
      const pad = 2;
      const rx = x + pad;
      const ry = y + pad;
      const w = size - pad * 2;
      const radius = 6;

      context.save();
      if (isGhost) {
        context.globalAlpha = 0.25;
      }

      // Draw rounded rectangle block
      context.beginPath();
      context.roundRect(rx, ry, w, w, radius);
      context.fillStyle = color;
      context.fill();

      // Block Border
      context.lineWidth = 3;
      context.strokeStyle = borderColor;
      context.stroke();

      // Glossy highlight top-left
      context.beginPath();
      context.roundRect(rx + 3, ry + 3, w - 6, (w - 6) / 2, radius / 2);
      context.fillStyle = 'rgba(255, 255, 255, 0.35)';
      context.fill();

      // Draw cute eyes on the block
      if (eyeStyle && !isGhost) {
        const eyeX1 = rx + w * 0.35;
        const eyeX2 = rx + w * 0.65;
        const eyeY = ry + w * 0.45;
        const eyeR = size * 0.09;

        context.fillStyle = '#1e293b';

        if (eyeStyle === 'happy') {
          // Arc eyes ^ ^
          context.lineWidth = 2;
          context.strokeStyle = '#1e293b';
          context.beginPath();
          context.arc(eyeX1, eyeY, eyeR, Math.PI, 0);
          context.stroke();
          context.beginPath();
          context.arc(eyeX2, eyeY, eyeR, Math.PI, 0);
          context.stroke();
        } else if (eyeStyle === 'wink') {
          // One circle, one line
          context.beginPath();
          context.arc(eyeX1, eyeY, eyeR, 0, Math.PI * 2);
          context.fill();
          context.lineWidth = 2;
          context.strokeStyle = '#1e293b';
          context.beginPath();
          context.moveTo(eyeX2 - eyeR, eyeY);
          context.lineTo(eyeX2 + eyeR, eyeY);
          context.stroke();
        } else {
          // Standard cute eyes with white glint
          context.beginPath();
          context.arc(eyeX1, eyeY, eyeR, 0, Math.PI * 2);
          context.arc(eyeX2, eyeY, eyeR, 0, Math.PI * 2);
          context.fill();

          // White shiny dots
          context.fillStyle = '#ffffff';
          context.beginPath();
          context.arc(eyeX1 - 1, eyeY - 1, eyeR * 0.4, 0, Math.PI * 2);
          context.arc(eyeX2 - 1, eyeY - 1, eyeR * 0.4, 0, Math.PI * 2);
          context.fill();
        }
      }

      context.restore();
    }

    function drawGhostPiece() {
      if (!currentPiece) return;
      let ghostY = currentPiece.y;
      while (!collide(currentPiece.x, ghostY + 1, currentPiece.shape)) {
        ghostY++;
      }

      for (let r = 0; r < currentPiece.shape.length; r++) {
        for (let c = 0; c < currentPiece.shape[r].length; c++) {
          if (currentPiece.shape[r][c]) {
            drawBlock(
              ctx,
              (currentPiece.x + c) * BLOCK_SIZE,
              (ghostY + r) * BLOCK_SIZE,
              BLOCK_SIZE,
              currentPiece.color,
              currentPiece.borderColor,
              null,
              true
            );
          }
        }
      }
    }

    function render() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw grid lines gently
      ctx.strokeStyle = 'rgba(203, 213, 225, 0.3)';
      ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * BLOCK_SIZE, 0);
        ctx.lineTo(c * BLOCK_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * BLOCK_SIZE);
        ctx.lineTo(canvas.width, r * BLOCK_SIZE);
        ctx.stroke();
      }

      // Draw locked board blocks
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c]) {
            drawBlock(
              ctx,
              c * BLOCK_SIZE,
              r * BLOCK_SIZE,
              BLOCK_SIZE,
              board[r][c].color,
              board[r][c].borderColor,
              board[r][c].eyeStyle
            );
          }
        }
      }

      // Draw Ghost & Active Piece
      if (currentPiece) {
        drawGhostPiece();

        for (let r = 0; r < currentPiece.shape.length; r++) {
          for (let c = 0; c < currentPiece.shape[r].length; c++) {
            if (currentPiece.shape[r][c]) {
              drawBlock(
                ctx,
                (currentPiece.x + c) * BLOCK_SIZE,
                (currentPiece.y + r) * BLOCK_SIZE,
                BLOCK_SIZE,
                currentPiece.color,
                currentPiece.borderColor,
                currentPiece.eyeStyle
              );
            }
          }
        }
      }

      // Draw floating confetti/particles
      drawParticles();
    }

    function drawNextPiece() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;

      const size = 20;
      const offsetX = (nextCanvas.width - nextPiece.shape[0].length * size) / 2;
      const offsetY = (nextCanvas.height - nextPiece.shape.length * size) / 2;

      for (let r = 0; r < nextPiece.shape.length; r++) {
        for (let c = 0; c < nextPiece.shape[r].length; c++) {
          if (nextPiece.shape[r][c]) {
            drawBlock(
              nextCtx,
              offsetX + c * size,
              offsetY + r * size,
              size,
              nextPiece.color,
              nextPiece.borderColor,
              nextPiece.eyeStyle
            );
          }
        }
      }
    }

    // --- Main Game Loop & Game Over Management ---
    function gameLoop(timestamp) {
      if (!isPaused && !isGameOver) {
        if (!lastDropTime) lastDropTime = timestamp;
        const progress = timestamp - lastDropTime;

        if (progress > dropInterval) {
          moveDown();
          lastDropTime = timestamp;
        }

        updateParticles();
        render();
      }
      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      isGameOver = true;
      isPaused = true;
      playGameOverSound();

      const modal = document.getElementById('modalOverlay');
      document.getElementById('modalEmoji').textContent = "👑";
      document.getElementById('modalTitle').textContent = "우와! 정말 잘했어요!";
      document.getElementById('modalDesc').innerHTML = `최종 점수: <strong class="text-pink-600 text-2xl">${score}점</strong><br>다시 도전해 볼까요?`;
      document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-rotate-right"></i><span>다시 하기!</span>`;
      modal.classList.remove('hidden');
    }

    function resetGame() {
      board = createBoard();
      score = 0;
      isGameOver = false;
      isPaused = false;
      document.getElementById('scoreText').textContent = '0';

      currentPiece = getRandomPiece();
      nextPiece = getRandomPiece();
      drawNextPiece();

      document.getElementById('modalOverlay').classList.add('hidden');
      lastDropTime = performance.now();
    }

    // Window Init
    window.onload = () => {
      setupControls();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
